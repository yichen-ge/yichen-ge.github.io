# Personal site, built with Jekyll and hosted on GitHub Pages.
locale: "en-US"
site_theme: "default"
title: "Yichen Ge"
title_separator: "-"
name: "Yichen Ge"
description: "Yichen Ge — research in computer vision, human motion generation, and generative models."
url: "https://yichen-ge.github.io"
baseurl: ""
repository: "yichen-ge/yichen-ge.github.io"

author:
  avatar: "gyc.jpg"
  name: "Yichen Ge"
  bio: "Master’s Student in Artificial Intelligence"
  location: "Beijing, China"
  employer: "China University of Petroleum (Beijing)"
  email: "2024216101@student.cup.edu.cn"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=cUYQ3esAAAAJ"
  github: "yichen-ge"

publication_category:
  manuscripts:
    title: "Journal articles"
  conferences:
    title: "Conference papers"

breadcrumbs: false
future: false
read_more: "disabled"
comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: false

include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .agents
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - .trae
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - scripts
  - tmp
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

# Publications supply list data only; no individual paper pages are generated.
collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: null
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
